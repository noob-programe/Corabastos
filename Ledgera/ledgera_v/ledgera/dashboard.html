<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ledgera · Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

  <!-- Fondos decorativos -->
  <div class="bg-blob bg-blob--1"></div>
  <div class="bg-blob bg-blob--2"></div>
  <div class="bg-blob bg-blob--3"></div>

  <header class="header">
    <!-- Logo (izquierda) -->
    <a href="#" class="logo">Led<span>gera</span></a>

    <div class="perfil-wrapper">
      <button class="perfil-btn" id="perfilBtn" aria-haspopup="true" aria-expanded="false">
        <span class="nombre" id="nombreUsuario">Iniciar sesión</span>
        <div class="avatar" id="avatarUsuario">?</div>
      </button>

      <div class="dropdown" id="dropdown" role="menu">
        <a href="#" role="menuitem" data-solo="Dueno" data-menu-modulo="equipo">
          <svg viewBox="0 0 640 512" aria-hidden="true"><path d="M144 0a80 80 0 1 1 0 160A80 80 0 1 1 144 0zM512 0a80 80 0 1 1 0 160A80 80 0 1 1 512 0zM0 298.7C0 239.8 47.8 192 106.7 192h42.7c15.9 0 31 3.5 44.6 9.7c-1.3 7.2-1.9 14.7-1.9 22.3c0 38.2 16.8 72.5 43.3 96c-.2 0-.4 0-.7 0H21.3C9.6 320 0 310.4 0 298.7zM405.3 320c-.2 0-.4 0-.7 0c26.6-23.5 43.3-57.8 43.3-96c0-7.6-.7-15-1.9-22.3c13.6-6.3 28.7-9.7 44.6-9.7h42.7C592.2 192 640 239.8 640 298.7c0 11.6-9.6 21.3-21.3 21.3H405.3zM224 224a96 96 0 1 1 192 0 96 96 0 1 1 -192 0zM128 485.3C128 411.7 187.7 352 261.3 352H378.7C452.3 352 512 411.7 512 485.3c0 14.7-11.9 26.7-26.7 26.7H154.7c-14.7 0-26.7-11.9-26.7-26.7z"/></svg>
          Mi equipo
        </a>
        <a href="cambiar-clave.html" role="menuitem">
          <svg viewBox="0 0 512 512" aria-hidden="true"><path d="M495.9 166.6c3.2 8.7 .5 18.4-6.4 24.6l-43.3 39.4c1.1 8.3 1.7 16.8 1.7 25.4s-.6 17.1-1.7 25.4l43.3 39.4c6.9 6.2 9.6 15.9 6.4 24.6-4.4 11.9-9.7 23.3-15.8 34.3l-4.7 8.1c-6.6 11-14 21.4-22.1 31.2-5.9 7.2-15.7 9.6-24.5 6.8l-55.7-17.7c-13.4 10.3-28.2 18.9-44 25.4l-12.5 57.1c-2 9.1-9 16.3-18.2 17.8-13.6 2.3-27.5 3.5-41.6 3.5s-28-1.2-41.6-3.5c-9.2-1.5-16.2-8.7-18.2-17.8l-12.5-57.1c-15.8-6.5-30.6-15.1-44-25.4L83.1 425.9c-8.8 2.8-18.6 .3-24.5-6.8-8.1-9.8-15.5-20.2-22.1-31.2l-4.7-8.1c-6.1-11-11.4-22.4-15.8-34.3-3.2-8.7-.5-18.4 6.4-24.6l43.3-39.4C64.6 273.1 64 264.6 64 256s.6-17.1 1.7-25.4L22.4 191.2c-6.9-6.2-9.6-15.9-6.4-24.6 4.4-11.9 9.7-23.3 15.8-34.3l4.7-8.1c6.6-11 14-21.4 22.1-31.2 5.9-7.2 15.7-9.6 24.5-6.8l55.7 17.7c13.4-10.3 28.2-18.9 44-25.4l12.5-57.1c2-9.1 9-16.3 18.2-17.8C227.3 1.2 241.2 0 255.2 0s27.9 1.2 41.5 3.5c9.2 1.5 16.2 8.7 18.2 17.8l12.5 57.1c15.8 6.5 30.6 15.1 44 25.4l55.7-17.7c8.8-2.8 18.6-.3 24.5 6.8 8.1 9.8 15.5 20.2 22.1 31.2l4.7 8.1c6.1 11 11.4 22.4 15.8 34.3zM256 336a80 80 0 1 0 0-160 80 80 0 1 0 0 160z"/></svg>
          Cambiar contraseña
        </a>
        <a href="#" class="cerrar" role="menuitem">
          <svg viewBox="0 0 512 512" aria-hidden="true"><path d="M377.9 105.9L500.7 228.7c7.2 7.2 11.3 17.1 11.3 27.3s-4.1 20.1-11.3 27.3L377.9 406.1c-6.4 6.4-15 9.9-24 9.9c-18.7 0-33.9-15.2-33.9-33.9l0-62.1-128 0c-17.7 0-32-14.3-32-32l0-64c0-17.7 14.3-32 32-32l128 0 0-62.1c0-18.7 15.2-33.9 33.9-33.9c9 0 17.6 3.6 24 9.9zM160 96L96 96c-17.7 0-32 14.3-32 32l0 256c0 17.7 14.3 32 32 32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32l-64 0c-53 0-96-43-96-96L0 128C0 75 43 32 96 32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32z"/></svg>
          Cerrar sesión
        </a>
      </div>
    </div>
  </header>

  <!-- ============ MAIN ============ -->
  <main class="main">
    <h1 class="saludo" id="saludo"></h1>

    <!-- Cards -->
    <section class="cards-container">
      <div class="card" data-modulo="ventas">
        <div class="card__icono">
          <svg viewBox="0 0 576 512" aria-hidden="true"><path d="M64 64C28.7 64 0 92.7 0 128V384c0 35.3 28.7 64 64 64H512c35.3 0 64-28.7 64-64V128c0-35.3-28.7-64-64-64H64zm64 320H64V320c35.3 0 64 28.7 64 64zM64 192V128h64c0 35.3-28.7 64-64 64zM448 384c0-35.3 28.7-64 64-64v64H448zm64-192c-35.3 0-64-28.7-64-64h64v64zM288 160a96 96 0 1 1 0 192 96 96 0 1 1 0-192z"/></svg>
        </div>
        <span class="card__texto">Ventas</span>
      </div>

      <div class="card" data-modulo="inventario">
        <div class="card__icono">
          <svg viewBox="0 0 640 512" aria-hidden="true"><path d="M392.8 1.2c-17-4.9-34.7 5-39.6 22l-128 448c-4.9 17 5 34.7 22 39.6s34.7-5 39.6-22l128-448c4.9-17-5-34.7-22-39.6zm80.6 120.1c-12.5 12.5-12.5 32.8 0 45.3L562.7 256l-89.4 89.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0l112-112c12.5-12.5 12.5-32.8 0-45.3l-112-112c-12.5-12.5-32.8-12.5-45.3 0zm-306.7 0c-12.5-12.5-32.8-12.5-45.3 0l-112 112c-12.5 12.5-12.5 32.8 0 45.3l112 112c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L77.3 256l89.4-89.4c12.5-12.5 12.5-32.8 0-45.3z"/></svg>
        </div>
        <span class="card__texto">Inventario</span>
      </div>

      <div class="card" data-modulo="fiado">
        <div class="card__icono">
          <svg viewBox="0 0 512 512" aria-hidden="true"><path d="M256 0c4.6 0 9.2 1 13.4 2.9L457.7 82.8c22 9.3 38.4 31 38.3 57.2c-.5 99.2-41.3 280.7-213.6 363.2c-16.7 8-36.1 8-52.8 0C57.3 420.7 16.5 239.2 16 140c-.1-26.2 16.3-47.9 38.3-57.2L242.7 2.9C246.8 1 251.4 0 256 0zm0 66.8l0 378.1C394 378 431.1 230.1 432 141.4L256 66.8s0 0 0 0z"/></svg>
        </div>
        <span class="card__texto">Fiado</span>
      </div>

      <div class="card" data-modulo="egresos">
        <div class="card__icono">
          <svg viewBox="0 0 512 512" aria-hidden="true"><path d="M64 64h160v48H112v288h288V288h48v160H64V64zm224 0h160v160h-48V145L249 312l-34-34L382 111h-94V64z"/></svg>
        </div>
        <span class="card__texto">Egresos</span>
      </div>

      <div class="card" data-modulo="exportaciones" data-solo="Dueno">
        <div class="card__icono">
          <svg viewBox="0 0 512 512" aria-hidden="true"><path d="M156.6 384.9L125.7 354c-8.5-8.5-11.5-20.8-7.7-32.2c3-8.9 9.7-16.3 18.3-20.1L300.2 234c10.8-4.5 23.1-1.7 31.1 6.3l29.4 29.4c8.5 8.5 11.5 20.8 7.7 32.2c-3 8.9-9.7 16.3-18.3 20.1L185.7 388.7c-10.8 4.5-23.1 1.7-31.1-6.3z"/><path d="M383.9 15.2c-4.6-4.6-11.3-6.5-17.7-5.1L130.4 75.3c-4.6 1-8.5 4.1-10.6 8.3L15.4 289.8c-3.3 6.6-1.6 14.6 4.1 19.4l83.1 69.6c5.9 4.9 14.6 4.7 20.2-.6l98.7-92.3c5-4.7 12.5-4.7 17.6-.1l70.4 63.5c5.7 5.1 14.4 4.9 19.8-.5L488.9 172.7c4.6-4.6 6.4-11.3 4.6-17.6L394.6 27.2c-2.6-4.6-6.6-8.3-10.7-12z"/></svg>
        </div>
        <span class="card__texto">Exportaciones</span>
      </div>
    </section>

    <!-- Botón cierre de caja -->
    <section class="cierre-wrapper">
      <button class="btn-cierre" id="btnCierre">
        <svg viewBox="0 0 640 512" aria-hidden="true"><path d="M64 64C28.7 64 0 92.7 0 128V384c0 35.3 28.7 64 64 64H576c35.3 0 64-28.7 64-64V128c0-35.3-28.7-64-64-64H64zm0 64H576V384H64V128zm96 96c0-17.7 14.3-32 32-32h64c17.7 0 32 14.3 32 32s-14.3 32-32 32H192c-17.7 0-32-14.3-32-32zm160 0c0-17.7 14.3-32 32-32h64c17.7 0 32 14.3 32 32s-14.3 32-32 32H352c-17.7 0-32-14.3-32-32z"/></svg>
        Cierre de caja
      </button>
    </section>
  </main>

  <footer class="footer">
    <div>© 2026 <strong>Ledgera</strong> · Todos los derechos reservados.</div>
    <div class="footer__links">
      <a href="#">Términos y condiciones</a>
      <a href="#">Política de privacidad</a>
      <a href="#">Soporte</a>
    </div>
  </footer>

  <script src="js/dashboard.js"></script>
</body>
</html>
